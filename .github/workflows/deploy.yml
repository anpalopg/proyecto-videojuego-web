name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Astro Landing Page (frontend)
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build React Store (store-frontend)
        env:
          VITE_BASE_PATH: /proyecto-videojuego-web/store/
        run: |
          cd store-frontend
          npm install
          npm run build

      - name: Combine Site Structure
        run: |
          mkdir -p frontend/dist/store
          cp -r store-frontend/dist/* frontend/dist/store/
          # Ensure SPA routing works in /store subpath on GitHub Pages
          cp store-frontend/dist/index.html frontend/dist/store/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
